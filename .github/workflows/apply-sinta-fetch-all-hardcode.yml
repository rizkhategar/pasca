name: Apply SINTA Fetch All Hardcode Cleanup

on:
  push:
    branches:
      - refactor/lecturer-filament-resource
    paths:
      - .github/workflows/apply-sinta-fetch-all-hardcode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lecturer-filament-resource

      - name: Patch files
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('app/Filament/Resources/SintaLecturer/Pages/ImportSintaLecturers.php')
          text = page.read_text()
          text = text.replace("use App\\Models\\SintaLecturerFetchAllScheduleSetting;\n", "")
          text = text.replace("use Filament\\Forms\\Components\\TimePicker;\n", "")
          text = text.replace("use Filament\\Forms\\Components\\Toggle;\n", "")
          text = text.replace("use Illuminate\\Support\\Facades\\Schema as SchemaFacade;\n", "")

          if "public const AUTO_FETCH_ALL_TIME" not in text:
              text = text.replace(
                  "    private const BULK_PRODI_MODAL_MAX_LIMIT = 100;\n",
                  "    private const BULK_PRODI_MODAL_MAX_LIMIT = 100;\n\n"
                  "    /**\n"
                  "     * Ubah jam otomatis Fetch All SINTA di sini.\n"
                  "     * Format: HH:MM, contoh '00:00', '23:30'.\n"
                  "     */\n"
                  "    public const AUTO_FETCH_ALL_TIME = '00:00';\n"
              )

          start = text.find("    public function setTimerFetchAllAction(): Actions\\Action\n    {")
          if start != -1:
              end = text.find("\n    public function settingProdiFetchAllAction(): Actions\\Action", start)
              if end == -1:
                  raise SystemExit('Could not find end of setTimerFetchAllAction block')
              text = text[:start] + text[end + 1:]

          page.write_text(text)

          command = Path('app/Console/Commands/RunScheduledSintaLecturerFetchAll.php')
          text = command.read_text()
          if "use App\\Filament\\Resources\\SintaLecturer\\Pages\\ImportSintaLecturers;\n" not in text:
              text = text.replace(
                  "namespace App\\Console\\Commands;\n\n",
                  "namespace App\\Console\\Commands;\n\nuse App\\Filament\\Resources\\SintaLecturer\\Pages\\ImportSintaLecturers;\n"
              )

          text = text.replace(
              "    /**\n"
              "     * Ubah jam otomatis Fetch All di sini.\n"
              "     * Format: HH:MM, contoh '00:00', '23:30'.\n"
              "     */\n"
              "    private const HARDCODED_SCHEDULED_TIME = '00:00';\n\n",
              ""
          )
          text = text.replace(
              "        $setting = SintaLecturerFetchAllScheduleSetting::current();\n\n"
              "        if (! $setting->is_enabled) {\n"
              "            return self::SUCCESS;\n"
              "        }\n\n",
              "        $setting = SintaLecturerFetchAllScheduleSetting::current();\n\n"
          )
          text = text.replace(
              "        $scheduledTime = self::HARDCODED_SCHEDULED_TIME;\n",
              "        $scheduledTime = ImportSintaLecturers::AUTO_FETCH_ALL_TIME;\n"
          )
          command.write_text(text)

          console = Path('routes/console.php')
          text = console.read_text().replace(
              "RunScheduledSintaLecturerFetchAll::HARDCODED_SCHEDULED_TIME",
              "ImportSintaLecturers::AUTO_FETCH_ALL_TIME"
          )
          console.write_text(text)

          Path('.github/workflows/apply-sinta-fetch-all-hardcode.yml').unlink(missing_ok=True)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Filament/Resources/SintaLecturer/Pages/ImportSintaLecturers.php app/Console/Commands/RunScheduledSintaLecturerFetchAll.php routes/console.php .github/workflows/apply-sinta-fetch-all-hardcode.yml
          if ! git diff --cached --quiet; then
            git commit -m "refactor(sinta-lecturer): remove fetch all timer controls"
            git push origin HEAD:refactor/lecturer-filament-resource
          fi
