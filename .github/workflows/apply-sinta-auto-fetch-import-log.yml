name: Apply SINTA Auto Fetch Import Log Patch

on:
  push:
    branches:
      - refactor/lecturer-filament-resource
    paths:
      - .github/trigger-sinta-auto-fetch-import-log.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lecturer-filament-resource

      - name: Apply code changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Pattern not found for {label}')
              return text.replace(old, new, 1)

          # 1) Migration + model for automatic run logs
          migration_path = Path('database/migrations/2026_07_27_000001_create_sinta_lecturer_automatic_runs_table.php')
          if not migration_path.exists():
              migration_path.write_text("""<?php

