server {
    listen 80;
    server_name pascasarjana.unw.ac.id;

    # Redirect HTTP to HTTPS
    return 301 https://pascasarjana.unw.ac.id$request_uri;
}

server {
    listen 443 ssl;
    server_name pascasarjana.unw.ac.id;

    # SSL Certificates
    ssl_certificate /etc/ssl/unwsslbundle.crt;
    ssl_certificate_key /etc/ssl/unw.key;

    # SSL Settings
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Access Logs
    access_log /var/log/nginx/pascasarjana.access.log;
    error_log /var/log/nginx/pascasarjana.error.log;

    location / {
        # Proxy to Docker Container running on localhost:8104
        proxy_pass http://127.0.0.1:8104;

        # Headers to pass real client IP to the app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SINTA scraper SSE endpoints stream progress in real time. The inner
    # container nginx consumes the upstream `X-Accel-Buffering: no` header and
    # does not forward it, so this host proxy must disable buffering itself --
    # otherwise it holds the entire response until the (multi-minute) scrape
    # finishes and the browser's EventSource fires onerror ("interrupted").
    location ^~ /scrap/ {
        proxy_pass http://127.0.0.1:8104;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream immediately instead of buffering the whole response.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # A full scrape can run for several minutes; don't cut the stream off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
